<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japan Spend Tracker</title>
<meta name="description" content="Log every yen spent in Japan against your trip budget.">
<meta name="theme-color" content="#EDF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B101C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japan Spend">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: one-hand phone column. Sticky tab header, ticket-paper cards, thumb bar fixed at the bottom. Yen leads, dollars follow. */
:root{
  color-scheme:light;
  --paper:#EDF0EC;
  --surface:#FFFFFF;
  --surface-2:#F5F7F4;
  --ink:#141C33;
  --ink-2:#56607A;
  --rule:#D3D9D6;
  --accent:#27408B;
  --accent-ink:#FFFFFF;
  --accent-soft:#E2E7F6;
  --stamp:#C3352B;
  --stamp-soft:#FAE5E2;
  --good:#1D7552;
  --warn:#9A620B;
  --warn-soft:#FAEFD8;
  --l-cards:#3A50B5;
  --l-hannah:#A9416F;
  --l-food_transport:#17806A;
  --l-you:#A86C08;
  --scrim:rgba(10,14,28,.48);
  --shadow:0 1px 0 rgba(20,28,51,.05), 0 10px 24px -16px rgba(20,28,51,.28);
  --f-display:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,"Yu Gothic",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --paper:#0B101C; --surface:#141B2B; --surface-2:#1A2236; --ink:#E8ECF4; --ink-2:#99A3BB; --rule:#28314A;
    --accent:#97A9FF; --accent-ink:#0B101C; --accent-soft:#1D2747;
    --stamp:#FF7B6F; --stamp-soft:#3B1D1F; --good:#52C79A; --warn:#EBB352; --warn-soft:#342914;
    --l-cards:#8E9DFF; --l-hannah:#EF8DBB; --l-food_transport:#52CFAF; --l-you:#EDB24E;
    --scrim:rgba(0,0,0,.6); --shadow:0 0 0 1px rgba(255,255,255,.02);
  }
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px}
.mark{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:800;font-size:19px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand p{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;padding:3px}
.tab{border:0;background:transparent;border-radius:9px;padding:8px 0;font-weight:600;font-size:14px;color:var(--ink-2)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

main.wrap{display:flex;flex-direction:column;gap:14px;padding-block:16px calc(130px + env(safe-area-inset-bottom,0px))}

/* shared type */
.eyebrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.h{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}

/* hero ticket */
.hero{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.hero::after{content:"";position:absolute;right:-28px;top:-28px;width:120px;height:120px;border-radius:50%;border:2px solid var(--accent-soft);pointer-events:none}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,15vw,64px);line-height:1;letter-spacing:-.03em;margin-top:8px}
.big-label{font-size:14px;color:var(--ink-2)}
.hero.is-over .big{color:var(--stamp)}
.perf{position:relative;border-top:2px dashed var(--rule);margin:12px -18px 6px}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.perf::before{left:-9px}.perf::after{right:-9px}
.meter{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--rule);overflow:hidden}
.meter i{display:block;height:100%;background:var(--l-food_transport);border-radius:99px}
.hero.is-over .meter i{background:var(--stamp)}
.hero-row{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink-2)}
.hero-row b{color:var(--ink);font-weight:700}
.hero-note{font-size:12.5px;color:var(--ink-2)}

/* notices */
.notice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:600}
.notice .n{min-width:30px;height:30px;padding:0 8px;border-radius:99px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700}
.notice .go{margin-left:auto;color:var(--accent);font-weight:700;white-space:nowrap}
.install{flex-direction:column;align-items:flex-start;gap:6px;background:var(--accent-soft);border-color:transparent;font-weight:400}
.install b{font-weight:700}

/* lines */
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.line-top,.line-sub{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.line-name{font-weight:700;display:flex;align-items:center;gap:8px}
.line-name::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.line-rem{font-weight:700;white-space:nowrap}
.line.over .line-rem{color:var(--stamp)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--rule);overflow:hidden;margin-block:6px 5px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.line.over .bar i{background:var(--stamp)}
.line-sub{font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.line-split{font-size:12.5px;color:var(--ink-2);margin-top:4px;padding-top:6px;border-top:1px dotted var(--rule)}
.total-row{display:flex;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid var(--rule);font-weight:700;flex-wrap:wrap}
.total-row span:last-child{color:var(--ink-2);font-weight:500}

/* pace */
.pace-grid{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:13.5px}
.pace-grid .bar{margin:0}
.pace-grid .bar i{background:var(--accent)}
.pace-grid .bar.trip i{background:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;width:fit-content}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--stamp-soft);color:var(--stamp)}
.pill.info{background:var(--accent-soft);color:var(--accent)}

/* stat row */
.stat{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em}
.stat .u{font-size:13px;color:var(--ink-2)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 0}

/* checklist */
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}

/* buttons */
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:700;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--stamp);border-color:var(--stamp);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.ghost.danger-text{color:var(--stamp);border-color:color-mix(in srgb,var(--stamp) 40%,var(--rule))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:0;background:var(--surface-2);border-radius:10px;width:38px;height:38px;font-size:18px;line-height:1;color:var(--ink-2);flex:none}

/* bottom action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--rule)}
.actions .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px))}
.actions .row{display:flex;gap:10px}
.actions .btn{flex:1 1 0;min-height:58px;font-size:16.5px;border-radius:16px}
.strip{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:8px 12px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* empty */
.empty{background:var(--surface);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.empty h2{font-family:var(--f-display);font-weight:700;font-size:20px}
.empty p{color:var(--ink-2);max-width:42ch}

/* log */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day{display:flex;flex-direction:column;gap:6px}
.day-head{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);padding:4px 2px}
.entry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.thumb{flex:none;width:44px;height:44px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--c);display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-weight:700;color:var(--ink-2);font-size:15px}
.thumb img{width:100%;height:100%;object-fit:cover}
.entry-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.entry-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-meta{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.entry-amt{text-align:right;display:flex;flex-direction:column}
.entry-amt b{font-weight:700}
.entry-amt small{font-size:12px;color:var(--ink-2)}
.entry.cashrow{background:var(--surface-2);box-shadow:none;border:1px dashed var(--rule)}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2)}
.tag.info{background:var(--accent-soft);color:var(--accent)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.input{width:100%;border:1px solid var(--rule);background:var(--surface-2);border-radius:12px;padding:11px 12px;min-height:46px}
textarea.input{min-height:64px;resize:vertical}
select.input{appearance:none;-webkit-appearance:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:99px;padding:9px 14px;font-weight:600;font-size:14px;min-height:42px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.amt{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.amt b{font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--ink-2)}
.amt input{border:0;background:transparent;outline:none;width:100%;font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.02em;padding:0;min-width:0}
.amt.sm input{font-size:30px}.amt.sm b{font-size:24px}
.qty{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.qty output{min-width:28px;text-align:center;font-weight:700;color:var(--ink);font-size:17px}
.qty .total{margin-left:auto;font-weight:700;color:var(--ink)}
.err{color:var(--stamp);font-size:13.5px;font-weight:600;min-height:1em}
.ok{color:var(--good);font-size:13.5px;font-weight:600}
.hint{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:8px 10px}
.hint.warn{background:var(--warn-soft);color:var(--ink)}
.item-row{display:grid;grid-template-columns:1fr 54px 88px 38px;gap:6px;align-items:center}
.item-row input{min-width:0;border:1px solid var(--rule);background:var(--surface-2);border-radius:10px;padding:8px;min-height:40px}
.cat-row{display:grid;grid-template-columns:1fr 1fr 38px;gap:6px;align-items:center}
.cat-row .cat-sub{grid-column:1 / 3}
.cat-row input,.cat-row select{min-width:0;border:1px solid var(--rule);background:var(--surface-2);border-radius:10px;padding:8px;min-height:42px;width:100%}
.photo{position:relative;border:0;padding:0;background:var(--surface-2);border-radius:12px;overflow:hidden;width:100%;min-height:80px;max-height:220px;display:block}
.photo img{width:100%;max-height:220px;object-fit:contain;display:block}
.photo span{position:absolute;right:8px;bottom:8px;background:var(--scrim);color:#fff;font-size:12px;border-radius:6px;padding:2px 8px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}

/* sheets */
.sheet-wrap,.modal-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal-wrap{z-index:70;align-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:6px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet::before{content:"";width:40px;height:4px;border-radius:99px;background:var(--rule);align-self:center;margin-top:4px;flex:none}
.sheet::after{content:"";flex:none;height:calc(6px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-head h2{font-family:var(--f-display);font-weight:700;font-size:21px}
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.x{border:0;background:var(--surface-2);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.actions-row{display:flex;gap:8px;position:sticky;bottom:0;z-index:2;background:var(--surface);border-top:1px solid var(--rule);margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.actions-row .btn{flex:1 1 0;min-height:52px}
.modal{position:relative;background:var(--surface);border-radius:18px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
.modal h3{font-family:var(--f-display);font-size:18px}
.modal p{color:var(--ink-2)}
.modal-actions{display:flex;gap:8px}.modal-actions .btn{flex:1}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;border:0;width:100%}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

/* toast */
#toast-root{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 14px 12px 16px;font-weight:600;max-width:520px;box-shadow:0 12px 30px -12px rgba(0,0,0,.45)}
.toast-act{border:0;background:transparent;color:var(--paper);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px}

details.more>summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent);list-style:none;padding:6px 0}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"− "}
details.more>div{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.danger-zone{border:1px solid color-mix(in srgb,var(--stamp) 35%,var(--rule));background:transparent;box-shadow:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <span class="mark" aria-hidden="true">円</span>
      <h1>Japan Spend</h1><p id="sub"></p>
    </div>
    <nav class="tabs" aria-label="Screens">
      <button class="tab" data-act="tab" data-view="home" aria-current="page">Home</button>
      <button class="tab" data-act="tab" data-view="log">Log</button>
      <button class="tab" data-act="tab" data-view="settings">Settings</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav class="actions" aria-label="Log spending">
  <div class="wrap">
    <div class="strip" id="scan-strip" hidden><span class="spin" aria-hidden="true"></span><span id="scan-text">Reading…</span></div>
    <div class="row">
      <button class="btn primary" id="btn-scan" data-act="scan">Scan</button>
      <button class="btn" id="btn-quick" data-act="quick">Add</button>
    </div>
  </div>
</nav>

<input type="file" id="scan-input" accept="image/*" multiple hidden>
<input type="file" id="restore-input" accept="application/json,.json" hidden>
<div id="sheet-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
"use strict";
const TAX_SWITCH = "2026-11-01";
const OSAKA_TO_TOKYO = "2026-10-30";
const DKEY = "jst-data-v1";
const KEY_KEY = "jst-api-key";
const CHECK_KEY = "jst-departure-v1";
const API_URL = "https://api.anthropic.com/v1/messages";
const MODELS = [["claude-opus-5-5", "Opus 5.5 (best)"], ["claude-sonnet-5-5", "Sonnet 5.5 (cheaper)"]];
const HINT_LINE = { food: "food_transport", transit: "food_transport", cards: "cards", clothes: "you", gift: "hannah" };
const HINT_SUB = { food: "food", transit: "transit" };
const KNOWN_LINES = ["cards", "hannah", "food_transport", "you"];

const PROMPT = `This photo shows one or more receipts from Japan. Reply with only one JSON object:
{"receipts": [
  {"merchant": string|null, "date": "YYYY-MM-DD"|null, "total_jpy": integer|null,
   "tax_jpy": integer|null, "tax_free": boolean,
   "category_hint": "food"|"transit"|"cards"|"clothes"|"gift"|"other",
   "items": [{"desc": string, "qty": integer, "price_jpy": integer}],
   "confidence": "high"|"medium"|"low"}
]}
Rules:
- One entry per separate receipt in the photo. Empty array if no receipt is visible.
- total_jpy is the amount actually paid, tax included (合計 / お会計 / ご請求額 / 税込合計).
- Never use お預り (cash handed over) or お釣り (change) as the total.
- Dates may be 2026年10月28日, 26/10/28, or 令和8年 (Reiwa 8 = 2026).
- tax_free is true only if the receipt shows 免税 or a tax-free form.
- Translate item names to short English. At most 10 items.
- Use null for anything unreadable. Do not guess numbers.`;

const S = { view: "home", filter: "all", sheet: null, review: null, scan: null, settingsDirty: false, qa: null, reviewBusy: false };

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yen = n => (n < 0 ? "−" : "") + "¥" + Math.abs(Math.round(n || 0)).toLocaleString("en-US");
const usd = (n, dp = 2) => (n < 0 ? "−" : "") + "$" + Math.abs(n || 0).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
const round2 = n => Math.round(n * 100) / 100;
const sum = (arr, k) => arr.reduce((a, x) => a + (+x[k] || 0), 0);
const int = v => { const n = parseInt(String(v ?? "").replace(/[^\d]/g, ""), 10); return Number.isFinite(n) ? n : null; };
const norm = s => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const tz = () => DB.settings?.tz || "Asia/Tokyo";
const today = () => new Intl.DateTimeFormat("en-CA", { timeZone: tz(), year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
const dnum = d => { const [y, m, dd] = d.split("-").map(Number); return Date.UTC(y, m - 1, dd) / 864e5; };
const addDays = (d, n) => new Date((dnum(d) + n) * 864e5).toISOString().slice(0, 10);
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(dnum(s));
const fmtDay = d => new Date(dnum(d) * 864e5).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
const fmtShort = d => new Date(dnum(d) * 864e5).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
const fmtWhen = iso => { try { return new Date(iso).toLocaleString("en-US", { timeZone: tz(), month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch { return ""; } };
const lines = () => DB.settings.lines || [];
const cats = () => DB.settings.quick_categories || [];
const lineName = id => lines().find(l => l.id === id)?.name || "No line";
const lineColor = id => KNOWN_LINES.includes(id) ? `var(--l-${id})` : "var(--ink-2)";
const payLabel = p => p === "card" ? (DB.settings.card_label || "Card") : p === "ic" ? "IC" : "Cash";
const defaultTax = (flag, date) => flag ? (date >= TAX_SWITCH ? "refund_pending" : "at_store") : "none";
const refundFor = amt => Math.round((amt || 0) * 10 / 110);
const isStandalone = () => window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;

/* ---------- local storage ---------- */
function loadDB() {
  try {
    const d = JSON.parse(localStorage.getItem(DKEY));
    if (d && d.settings) return { expenses: {}, drafts: {}, cash: {}, ...d, settings: { ...DEFAULT_SETTINGS, ...d.settings } };
  } catch {}
  return { settings: structuredClone(DEFAULT_SETTINGS), expenses: {}, drafts: {}, cash: {} };
}
let DB = loadDB();
function persist() {
  try { localStorage.setItem(DKEY, JSON.stringify(DB)); return true; }
  catch { toast("Couldn't save: your phone's storage for this app is full. Export a backup, then delete old receipt photos.", { ms: 8000 }); return false; }
}
function put(coll, id, data) { DB[coll][id] = data; persist(); render(); }
function del(coll, id) { delete DB[coll][id]; persist(); render(); }
const rows = coll => Object.entries(DB[coll]).map(([id, d]) => ({ id, ...d }));
const E = () => rows("expenses");
const D = () => rows("drafts").sort((a, b) => (a.seq || 0) - (b.seq || 0));
const C = () => rows("cash");
const apiKey = () => { try { return localStorage.getItem(KEY_KEY) || ""; } catch { return ""; } };

/* receipt photos live in IndexedDB; localStorage is too small for images */
let idbP = null;
function idb() {
  return idbP ||= new Promise((res, rej) => {
    const r = indexedDB.open("jst-photos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("photos");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(mode, fn) {
  return idb().then(db => new Promise((res, rej) => {
    const t = db.transaction("photos", mode);
    const req = fn(t.objectStore("photos"));
    t.oncomplete = () => res(req?.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  }));
}
const urlCache = new Map();
async function photoPut(blob) { const id = newId("p"); await tx("readwrite", s => s.put(blob, id)); return id; }
async function photoUrl(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  const blob = await tx("readonly", s => s.get(id));
  if (!blob) return null;
  const u = URL.createObjectURL(blob); urlCache.set(id, u); return u;
}
async function photoDel(id) {
  if (!id) return;
  try { await tx("readwrite", s => s.delete(id)); } catch {}
  if (urlCache.has(id)) { URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); }
}
function hydratePhotos(root = document) {
  root.querySelectorAll("img[data-photo]:not([src])").forEach(async img => {
    const u = await photoUrl(img.dataset.photo).catch(() => null);
    if (u) img.src = u; else img.replaceWith(document.createTextNode("¥"));
  });
}
async function maybeDeletePhoto(id, exceptId) {
  if (!id) return;
  const used = E().some(e => e.photo === id && e.id !== exceptId) || D().some(d => d.photo === id && d.id !== exceptId);
  if (!used) await photoDel(id);
}

function makeExpense(f) {
  const rate = f.rate || +DB.settings.rate_jpy_per_usd;
  const amount = f.amount_jpy, line = f.line;
  return {
    date: f.date, created_at: f.created_at || new Date().toISOString(),
    amount_jpy: amount, qty: f.qty || 1, unit_jpy: f.unit_jpy || amount,
    rate, amount_usd: round2(amount / rate),
    line, sub: line === "food_transport" ? (f.sub || "food") : null,
    payment: f.payment || "cash", merchant: f.merchant || "", note: f.note || "",
    source: f.source || "manual", photo: f.photo || null,
    tax_free: f.tax_free || "none", refund_jpy: f.tax_free === "refund_pending" ? (f.refund_jpy || 0) : 0,
    items: f.items || [],
  };
}

/* ---------- metrics ---------- */
function metrics() {
  const st = DB.settings, rate = +st.rate_jpy_per_usd, t = today(), ex = E();
  const tripDays = dnum(st.trip_end) - dnum(st.trip_start) + 1;
  const dayIdx = dnum(t) - dnum(st.trip_start) + 1;
  const phase = dayIdx < 1 ? "before" : dayIdx > tripDays ? "after" : "during";
  const daysLeft = phase === "before" ? tripDays : phase === "after" ? 0 : tripDays - dayIdx + 1;
  const L = lines().map(l => {
    const items = ex.filter(e => e.line === l.id);
    const spentJ = sum(items, "amount_jpy"), spentU = sum(items, "amount_usd"), budJ = Math.round(l.budget_usd * rate);
    return { ...l, spentJ, spentU, budJ, remJ: budJ - spentJ, remU: l.budget_usd - spentU, over: spentJ > budJ };
  });
  const fixed = Object.values(st.fixed_transit_jpy || {}).reduce((a, b) => a + (+b || 0), 0);
  const ft = L.find(l => l.id === "food_transport");
  const foodBudget = (ft ? ft.budJ : 0) - fixed;
  const food = ex.filter(e => e.line === "food_transport" && e.sub === "food");
  const foodSpent = sum(food, "amount_jpy");
  const foodToday = sum(food.filter(e => e.date === t), "amount_jpy");
  const foodBefore = sum(food.filter(e => e.date < t), "amount_jpy");
  const transitSpent = sum(ex.filter(e => e.line === "food_transport" && e.sub === "transit"), "amount_jpy");
  const allowance = phase === "after" ? 0 : Math.max(0, Math.round((foodBudget - (phase === "before" ? foodSpent : foodBefore)) / daysLeft));
  const totalBud = sum(L, "budJ"), totalSpent = sum(L, "spentJ");
  const refunds = ex.filter(e => e.tax_free === "refund_pending");
  const cashRows = C();
  const cashIn = sum(cashRows.filter(c => c.kind === "in"), "amount_jpy");
  const cashSpent = sum(ex.filter(e => e.payment === "cash"), "amount_jpy");
  const lastCount = cashRows.filter(c => c.kind === "count").sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)))[0] || null;
  return {
    t, rate, tripDays, dayIdx, phase, daysLeft, startIn: 1 - dayIdx, lines: L, fixed, foodBudget, foodSpent, foodToday, foodBefore,
    transitSpent, allowance, totalBud, totalSpent,
    pctSpent: totalBud ? totalSpent / totalBud : 0,
    pctTrip: phase === "before" ? 0 : phase === "after" ? 1 : dayIdx / tripDays,
    refund: sum(refunds, "refund_jpy"), refundCount: refunds.length,
    cashIn, cashSpent, expectedCash: cashIn - cashSpent, lastCount,
  };
}

/* ---------- render ---------- */
function render() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.view === S.view ? "page" : "false"));
  const st = DB.settings;
  $("#sub").textContent = `${fmtShort(st.trip_start)} – ${fmtShort(st.trip_end)}`;
  const main = $("#main");
  if (S.view === "settings") { if (!S.settingsDirty || !$("#settings-form")) main.innerHTML = viewSettings(); }
  else main.innerHTML = S.view === "log" ? viewLog() : viewHome();
  hydratePhotos(main);
  renderActions();
  if (S.sheet === "review") syncReview();
}
function renderActions() {
  $("#btn-scan").disabled = !!S.scan;
  const strip = $("#scan-strip");
  if (S.scan) {
    strip.hidden = false;
    $("#scan-text").textContent = `Reading ${Math.min(S.scan.started, S.scan.total)} of ${S.scan.total}…`;
  } else strip.hidden = true;
}

function viewHome() {
  const m = metrics(), out = [];
  if (!isStandalone()) out.push(`<div class="notice install"><span class="small">Tap Share → <b>Add to Home Screen</b> to install.</span></div>`);
  if (m.t >= addDays(DB.settings.trip_end, -1) && m.t <= DB.settings.trip_end) out.push(departureCard(m));
  const nd = D().length;
  if (nd) out.push(`<button class="notice" data-act="review"><span class="n">${nd}</span><span>to review</span><span class="go">Review →</span></button>`);
  out.push(heroToday(m), linesCard(m));
  if (m.refundCount || m.t >= TAX_SWITCH) out.push(refundCard(m));
  out.push(cashCard(m));
  return out.join("");
}
function city(t) {
  if (t < OSAKA_TO_TOKYO) return "Osaka";
  if (t === OSAKA_TO_TOKYO) return "Osaka → Tokyo";
  if (t === DB.settings.trip_end) return "Tokyo → home";
  return "Tokyo";
}
function heroToday(m) {
  if (m.phase === "before") {
    return `<section class="hero">
      <div class="eyebrow"><span>Food per day</span><span>In ${m.startIn} ${m.startIn === 1 ? "day" : "days"}</span></div>
      <div class="big">${yen(m.allowance)}</div>
      <div class="big-label">${usd(m.allowance / m.rate)} · ${m.tripDays} days</div>
    </section>`;
  }
  if (m.phase === "after") {
    return `<section class="hero">
      <div class="eyebrow"><span>Trip total</span></div>
      <div class="big">${yen(m.totalSpent)}</div>
      <div class="big-label">of ${yen(m.totalBud)} · ${usd(sum(m.lines, "spentU"))}</div>
    </section>`;
  }
  const left = m.allowance - m.foodToday, over = left < 0;
  const pct = m.allowance > 0 ? Math.min(m.foodToday / m.allowance, 1) : 1;
  return `<section class="hero ${over ? "is-over" : ""}">
    <div class="eyebrow"><span>Food today</span><span>Day ${m.dayIdx}/${m.tripDays} · ${esc(city(m.t))}</span></div>
    <div class="big">${yen(Math.abs(left))}</div>
    <div class="big-label">${over ? "over" : "left"} · ${usd(Math.abs(left) / m.rate)}</div>
    <div class="perf"></div>
    <div class="meter" aria-hidden="true"><i style="width:${(pct * 100).toFixed(1)}%"></i></div>
    <div class="hero-row"><span>${yen(m.foodToday)} spent</span><span>of ${yen(m.allowance)}</span></div>
  </section>`;
}
function linesCard(m) {
  const items = m.lines.map(l => {
    const pct = l.budJ > 0 ? Math.min(l.spentJ / l.budJ, 1) : 0;
    return `<li class="line ${l.over ? "over" : ""}" style="--c:${lineColor(l.id)}">
      <div class="line-top"><span class="line-name">${esc(l.name)}</span><span class="line-rem">${l.over ? "Over by " + yen(-l.remJ) : yen(l.remJ) + " left"}</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${(pct * 100).toFixed(1)}%"></i></div>
      <div class="line-sub"><span>${yen(l.spentJ)} of ${yen(l.budJ)}</span><span>${l.over ? usd(-l.remU, 0) + " over" : usd(l.remU, 0) + " left"}</span></div>
    </li>`;
  }).join("");
  return `<section class="card"><div class="card-head"><h2 class="h">Budget</h2>${pacePill(m)}</div><ul class="lines">${items}</ul>
    <div class="total-row"><span>${yen(m.totalSpent)} of ${yen(m.totalBud)}</span><span>${yen(m.totalBud - m.totalSpent)} left</span></div></section>`;
}
function pacePill(m) {
  if (m.phase !== "during") return "";
  const diff = Math.round(m.pctSpent * 100) - Math.round(m.pctTrip * 100);
  if (diff > 10) return `<span class="pill bad">${diff} pts ahead</span>`;
  if (diff > 3) return `<span class="pill warn">${diff} pts ahead</span>`;
  return `<span class="pill good">On pace</span>`;
}
function refundCard(m) {
  return `<section class="card"><div class="eyebrow"><span>Tax refund due</span><span>${m.refundCount} ${m.refundCount === 1 ? "purchase" : "purchases"}</span></div>
    <div class="stat"><div><div class="v">${yen(m.refund)}</div><div class="u">${usd(m.refund / m.rate)} · claim at customs</div></div></div></section>`;
}
function cashCard(m) {
  const lc = m.lastCount;
  return `<section class="card"><div class="eyebrow"><span>Cash on hand</span>${lc ? `<span>Counted ${yen(lc.amount_jpy)}</span>` : ""}</div>
    <div class="stat"><div class="v">${yen(m.expectedCash)}</div></div>
    <div class="btn-row"><button class="btn" data-act="cash" data-tab="in">Add cash</button><button class="btn" data-act="cash" data-tab="count">Count</button></div></section>`;
}
function departureCard(m) {
  let done = {}; try { done = JSON.parse(localStorage.getItem(CHECK_KEY) || "{}"); } catch {}
  const items = [
    ["customs", "Customs step before check-in"],
    ["items", "Refund items in carry-on"],
    ["passport", "Passport ready"],
    ["method", `Refund ${yen(m.refund)}: note each store's method`],
  ];
  return `<section class="card"><div class="eyebrow"><span>Before you fly</span><span>Haneda · ${fmtShort(DB.settings.trip_end)}</span></div>
    ${items.map(([k, t]) => `<label class="check"><input type="checkbox" id="chk-${k}" data-check="${k}" ${done[k] ? "checked" : ""}><span>${esc(t)}</span></label>`).join("")}</section>`;
}

/* ---------- log ---------- */
function viewLog() {
  const f = S.filter;
  const chips = [["all", "All"], ...lines().map(l => [l.id, l.name]), ["cash", "Cash"]]
    .map(([v, l]) => `<button class="fchip" data-act="filter" data-v="${esc(v)}" aria-pressed="${f === v}">${esc(l)}</button>`).join("");
  let list = E().map(e => ({ kind: "exp", ...e }));
  const cashRows = C().map(c => ({ kind: "cash", ...c }));
  if (f === "cash") list = cashRows;
  else if (f !== "all") list = list.filter(e => e.line === f);
  else list = list.concat(cashRows);
  list.sort((a, b) => (b.date || "").localeCompare(a.date || "") || String(b.created_at || "").localeCompare(String(a.created_at || "")));
  if (!list.length) {
    return `<div class="filters">${chips}</div>
      <div class="empty"><h2>Nothing yet</h2></div>`;
  }
  const groups = [];
  for (const r of list) { const last = groups[groups.length - 1]; if (last && last.date === r.date) last.rows.push(r); else groups.push({ date: r.date, rows: [r] }); }
  return `<div class="filters">${chips}</div>` + groups.map(g => {
    const dayTotal = sum(g.rows.filter(r => r.kind === "exp"), "amount_jpy");
    return `<section class="day"><div class="day-head"><span>${isDate(g.date) ? fmtDay(g.date) : "No date"}</span><span>${dayTotal ? yen(dayTotal) : ""}</span></div>
      ${g.rows.map(r => r.kind === "exp" ? entryRow(r) : cashRow(r)).join("")}</section>`;
  }).join("");
}
function entryRow(e) {
  const title = e.merchant || (e.sub ? (e.sub === "food" ? "Food" : "Transit") : lineName(e.line));
  const meta = [esc(lineName(e.line)) + (e.sub ? " / " + e.sub : ""), esc(payLabel(e.payment))];
  if (e.qty > 1) meta.push(`${yen(e.unit_jpy)} × ${e.qty}`);
  let tags = "";
  if (e.tax_free === "refund_pending") tags += `<span class="tag info">Refund ${yen(e.refund_jpy)}</span>`;
  if (e.tax_free === "at_store") tags += `<span class="tag">Tax-free</span>`;
  const thumb = e.photo ? `<img data-photo="${esc(e.photo)}" alt="">` : esc((title[0] || "¥").toUpperCase());
  return `<button class="entry" data-act="edit" data-id="${esc(e.id)}" style="--c:${lineColor(e.line)}">
    <span class="thumb">${thumb}</span>
    <span class="entry-main"><span class="entry-title">${esc(title)}</span><span class="entry-meta">${meta.join(" · ")}${tags}</span></span>
    <span class="entry-amt"><b>${yen(e.amount_jpy)}</b><small>${usd(e.amount_usd)}</small></span></button>`;
}
function cashRow(c) {
  const isIn = c.kind === "in";
  const meta = isIn ? esc(c.note || "Not spend") : `Expected ${yen(c.expected_jpy ?? 0)} · gap ${yen((c.expected_jpy ?? 0) - c.amount_jpy)}`;
  return `<button class="entry cashrow" data-act="cashrow" data-id="${esc(c.id)}" style="--c:var(--ink-2)">
    <span class="thumb">${isIn ? "+" : "="}</span>
    <span class="entry-main"><span class="entry-title">${isIn ? "Cash added" : "Wallet counted"}</span><span class="entry-meta">${meta}</span></span>
    <span class="entry-amt"><b>${yen(c.amount_jpy)}</b><small>${isIn ? "cash in" : "on hand"}</small></span></button>`;
}

/* ---------- Claude receipt reading ---------- */
function apiHeaders(key, model) {
  const h = { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
  if (model === "claude-opus-5-5" || model === "claude-sonnet-5-5") h["anthropic-beta"] = "server-side-fallback-2026-07-01";
  return h;
}
async function callClaude(content, maxTokens, keyOverride) {
  const key = keyOverride ?? apiKey(), model = DB.settings.model || "claude-opus-5-5";
  if (!key) throw { code: "no_key" };
  const body = { model, max_tokens: maxTokens, messages: [{ role: "user", content }] };
  if (model === "claude-opus-5-5" || model === "claude-sonnet-5-5") body.fallbacks = "default";
  let res;
  try { res = await fetch(API_URL, { method: "POST", headers: apiHeaders(key, model), body: JSON.stringify(body) }); }
  catch { throw { code: "network" }; }
  const json = await res.json().catch(() => null);
  if (!res.ok) {
    const msg = json?.error?.message || "";
    const code = res.status === 401 ? "auth"
      : res.status === 429 ? "rate_limited"
      : res.status === 400 && /credit/i.test(msg) ? "credit"
      : res.status === 529 || res.status >= 500 ? "overloaded" : "api";
    throw { code, message: msg };
  }
  if (json?.stop_reason === "refusal") throw { code: "refused" };
  return (json?.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}
function parseJSON(text) {
  try { return JSON.parse(text); } catch {}
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) { try { return JSON.parse(fence[1]); } catch {} }
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(text.slice(a, b + 1)); } catch {} }
  throw { code: "invalid_json" };
}
const blobToB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
async function readReceipt(blob) {
  const data = await blobToB64(blob);
  const media = ["image/jpeg", "image/png", "image/webp", "image/gif"].includes(blob.type) ? blob.type : "image/jpeg";
  const text = await callClaude([{ type: "image", source: { type: "base64", media_type: media, data } }, { type: "text", text: PROMPT }], 16000);
  return parseJSON(text);
}
async function testKey() {
  const st = $("#key-status"), key = $("#set-key").value.trim();
  DB.settings.model = $("#set-model").value;
  if (!key) { st.className = "small err"; st.textContent = "Paste your API key first."; return; }
  st.className = "small muted"; st.textContent = "Checking…";
  try {
    await callClaude("Reply with OK.", 256, key);
    st.className = "small ok"; st.textContent = "Key works. Tap Save.";
  } catch (e) { st.className = "small err"; st.textContent = scanError(e.code, e.message); }
}
function scanError(code, msg) {
  return {
    no_key: "Add your Anthropic API key in Settings first.",
    auth: "That API key isn't working. Check it in Settings.",
    credit: "Your Anthropic credit has run out. Add credit at console.anthropic.com.",
    rate_limited: "Too many scans right now. Try again in a minute.",
    network: "No signal. Scan once you're back online.",
    overloaded: "Claude is busy right now. Try again in a minute.",
    refused: "Claude declined to read that image.",
  }[code] || ("Something went wrong" + (msg ? ": " + msg : "."));
}

function bindEntryForm(sh, selfId) {
  const updDup = () => {

    $("#ef-dup").innerHTML = dup ? `<p class="hint warn"><b>Already saved?</b> ${esc(dup.merchant || lineName(dup.line))} ${yen(dup.amount_jpy)}, ${fmtShort(dup.date)}</p>` : "";
  };
  const refund = $("#ef-refund");
  sh.addEventListener("input", e => {
    if (["ef-amt", "ef-merchant", "ef-date"].includes(e.target.id)) updDup();
    if (e.target.id === "ef-amt" && segVal("ef-tax") === "refund_pending" && !refund.dataset.touched) refund.value = refundFor(int(e.target.value)) || "";
    if (e.target.id === "ef-refund") refund.dataset.touched = "1";
  });
  sh.addEventListener("segchange", e => {
    const { group, value } = e.detail;

}
function findDup(date, amt, merchant, selfId) {
  if (!date || !amt) return null;

}
function readEntryForm() {

function renderReview() {

function syncReview() {
  if (S.reviewBusy) return;
  const ds = D(), cur = ds.find(d => d.id === S.review?.id);
  if (!cur) { renderReview(); return; }
  const el = $("#rv-count"); if (el) el.textContent = `Receipt ${ds.indexOf(cur) + 1} of ${ds.length}`;
}
function nextDraftId(curId) {
  const all = D(), rest = all.filter(d => d.id !== curId);
  if (!rest.length) return null;
  const after = all.slice(all.findIndex(d => d.id === curId) + 1)[0];
  return (after || rest[0]).id;
}
function reviewSave() {
  const f = readEntryForm(); if (!f) return;
  const d = D().find(x => x.id === S.review.id); if (!d) return renderReview();
  const exp = makeExpense({ ...f, source: "scan", photo: d.photo || null });
  S.review = { id: nextDraftId(d.id) };
  S.reviewBusy = true;
  DB.expenses[newId("e")] = exp;
  delete DB.drafts[d.id];
  persist();
  render();
  S.reviewBusy = false;
  if (D().length) toast(`Saved ${yen(exp.amount_jpy)}${exp.merchant ? " · " + exp.merchant : ""}`);
  renderReview();
}
function reviewSkip() {
  const n = nextDraftId(S.review.id);
  if (!n) { closeSheet(); toast("Kept for later"); return; }
  S.review = { id: n }; renderReview();
}
async function reviewDiscard() {
  const d = D().find(x => x.id === S.review.id); if (!d) return renderReview();
  if (!(await confirmIn("Discard this receipt?", "It won't be saved and the photo is deleted.", "Discard"))) return;
  S.review = { id: nextDraftId(d.id) };
  S.reviewBusy = true;
  del("drafts", d.id);
  await maybeDeletePhoto(d.photo, d.id);
  S.reviewBusy = false;
  if (S.sheet === "review") renderReview();
}

    if (e.detail.group === "cash-tab") { $("#cash-in").hidden = e.detail.value !== "in"; $("#cash-count").hidden = e.detail.value !== "count"; }
    if (e.detail.group === "gap-line") $("#gap-sub-wrap").hidden = e.detail.value !== "food_transport";
  });
  (tab === "in" ? $("#cash-in-amt") : $("#cash-count-amt")).focus();
}
function cashInSave() {
  const amt = int($("#cash-in-amt").value);
  if (!amt) return void ($("#cash-err").textContent = "Enter how much cash you added.");
  const row = { date: today(), kind: "in", amount_jpy: amt, note: $("#cash-in-note").value.trim(), created_at: new Date().toISOString() };
  closeSheet();
  put("cash", newId("c"), row);
  toast(`Added ${yen(amt)} cash`);
}
function cashCountSave() {
  const amt = int($("#cash-count-amt").value);
  if (amt === null) return void ($("#cash-err").textContent = "Enter the yen you have on hand.");
  $("#cash-err").textContent = "";
  const m = metrics(), gap = m.expectedCash - amt;
  put("cash", newId("c"), { date: today(), kind: "count", amount_jpy: amt, expected_jpy: m.expectedCash, note: "", created_at: new Date().toISOString() });
  const res = $("#cash-result");
  if (gap > 0) {
    res.innerHTML = `<div class="hint warn" style="display:flex;flex-direction:column;gap:10px">
      <span><b>${yen(gap)} unlogged.</b></span>
      ${seg("gap-line", lines().map(l => [l.id, l.name]), "food_transport")}
      <div id="gap-sub-wrap">${seg("gap-sub", [["food", "Food"], ["transit", "Transit"]], "food")}</div>
      <button class="btn primary" data-act="gap-log" data-gap="${gap}">Log ${yen(gap)}</button></div>`;
  } else if (gap < 0) {
    res.innerHTML = `<p class="hint">${yen(-gap)} extra. Missing a cash add?</p>`;
  } else res.innerHTML = `<p class="hint"><b>Matches.</b></p>`;
}
function gapLog(gap) {
  const line = segVal("gap-line") || "food_transport";
  const exp = makeExpense({ date: today(), amount_jpy: gap, line, sub: segVal("gap-sub") || "food", payment: "cash", merchant: "Unlogged cash", note: "From wallet count", source: "manual" });
  closeSheet();
  put("expenses", newId("e"), exp);
  toast(`Logged ${yen(gap)} to ${lineName(line)}`);
}
async function openCashRow(id) {
  const c = C().find(x => x.id === id); if (!c) return;
  const label = c.kind === "in" ? `cash added (${yen(c.amount_jpy)})` : `wallet count (${yen(c.amount_jpy)})`;
  if (!(await confirmIn("Delete this cash row?", `The ${label} on ${fmtShort(c.date)} will be removed.`, "Delete"))) return;
  del("cash", id);
  toast("Cash row deleted");
}

/* ---------- scanning ---------- */
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const s = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    bmp.close?.();
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    if (blob) return blob;
  } catch {}
  return file;
}
function startScan() {
  if (!apiKey()) return openNoKey();
  if (!navigator.onLine) return toast(scanError("network"), { ms: 6000 });
  $("#scan-input").click();
}
async function scanFiles(files) {
  const list = [...files];
  if (!list.length) return;
  S.scan = { total: list.length, started: 0, stopped: null, drafts: 0 };
  renderActions();
  let next = 0;
  const worker = async () => {
    while (next < list.length && !S.scan.stopped) {
      const i = next++;
      S.scan.started++; renderActions();
      await readPhoto(list[i], i);
    }
  };
  await Promise.all([worker(), worker()]);
  const { stopped, drafts, total, started } = S.scan;
  const unread = total - started;
  S.scan = null; render();
  if (stopped) toast(scanError(stopped) + (unread ? ` ${unread} ${unread === 1 ? "photo wasn't" : "photos weren't"} read.` : ""), { ms: 8000 });
  if (drafts && !S.sheet) openReview();
}
async function readPhoto(file, i) {
  const t = today(), seqBase = Date.now() * 100 + i * 10;
  const img = await shrink(file);
  let photo = null;
  try { photo = await photoPut(img); } catch {}
  const blank = note => addDraft({ date: t, date_missing: true, amount_jpy: null, merchant: "", line: null, sub: null, payment: "cash", tax_free: "none", refund_jpy: 0, items: [], confidence: "low", photo, read_failed: true, note }, seqBase);
  let out;
  try {
    out = await readReceipt(img);
  } catch (e) {
    const code = e?.code;
    if (["no_key", "auth", "credit", "rate_limited", "network"].includes(code)) {
      if (S.scan) S.scan.stopped = code;
      if (photo) blank("Not read yet: " + scanError(code) + " Enter the total from the photo.");
      return;
    }
    blank("Couldn't read this one. Enter the total.");
    return;
  }
  const receipts = Array.isArray(out?.receipts) ? out.receipts : [];
  if (!receipts.length) { blank("Couldn't read this one. Enter the total."); return; }
  let k = 0;
  for (const r of receipts) {
    const date = isDate(r?.date) ? r.date : null;
    const amount = Number.isInteger(r?.total_jpy) ? r.total_jpy : int(r?.total_jpy);
    const hint = r?.category_hint;
    const tax = defaultTax(!!r?.tax_free, date || t);
    addDraft({
      date: date || t, date_missing: !date, amount_jpy: amount ?? null, tax_jpy: int(r?.tax_jpy),
      merchant: typeof r?.merchant === "string" ? r.merchant.trim() : "",
      line: HINT_LINE[hint] || null, sub: HINT_SUB[hint] || (HINT_LINE[hint] === "food_transport" ? "food" : null),
      payment: "cash", tax_free: tax, refund_jpy: tax === "refund_pending" ? refundFor(amount) : 0,
      items: (Array.isArray(r?.items) ? r.items : []).slice(0, 10).map(it => ({ desc: String(it?.desc || ""), qty: int(it?.qty) || 1, price_jpy: int(it?.price_jpy) || 0 })),
      confidence: ["high", "medium", "low"].includes(r?.confidence) ? r.confidence : "medium",
      photo, read_failed: amount == null, note: amount == null ? "Couldn't read the total. Enter it from the photo." : "",
    }, seqBase + k++);
  }
}
function addDraft(d, seq) {
  put("drafts", newId("d"), { ...d, source: "scan", seq, created_at: new Date().toISOString() });
  if (S.scan) S.scan.drafts++;
}

/* ---------- export, backup, wipe ---------- */
async function shareFile(name, text, mime) {
  const file = new File([text], name, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e?.name === "AbortError") return false; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}
async function exportCSV() {
  const cols = ["type", "date", "created_at", "merchant", "line", "sub", "payment", "amount_jpy", "qty", "unit_jpy", "rate", "amount_usd", "tax_free", "refund_jpy", "source", "note", "items"];
  const cell = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const all = [
    ...E().map(e => ({ ...e, type: "expense", line: lineName(e.line), items: (e.items || []).map(i => `${i.desc} x${i.qty} ¥${i.price_jpy}`).join("; ") })),
    ...C().map(c => ({ type: c.kind === "in" ? "cash_in" : "wallet_count", date: c.date, created_at: c.created_at, amount_jpy: c.amount_jpy, note: c.kind === "count" ? `expected ¥${c.expected_jpy ?? ""}` : c.note })),
  ].sort((a, b) => (a.date || "").localeCompare(b.date || "") || String(a.created_at || "").localeCompare(String(b.created_at || "")));
  const csv = "﻿" + [cols.join(","), ...all.map(r => cols.map(c => cell(r[c])).join(","))].join("\r\n");
  if (await shareFile(`japan-spend-${today()}.csv`, csv, "text/csv")) toast("CSV ready");
}
async function backup() {
  const data = JSON.stringify({ app: "japan-spend-tracker", version: 1, saved_at: new Date().toISOString(), ...DB }, null, 1);
  if (await shareFile(`japan-spend-backup-${today()}.json`, data, "application/json")) toast("Backup ready. Save it to Files.");
}
async function restore(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch { return toast("That file isn't a backup from this app."); }
  if (!d || d.app !== "japan-spend-tracker" || !d.settings) return toast("That file isn't a backup from this app.");
  const n = Object.keys(d.expenses || {}).length;
  if (!(await confirmIn("Restore this backup?", `It has ${n} expenses from ${fmtWhen(d.saved_at)}. Everything on this phone now is replaced. Receipt photos already here stay.`, "Restore"))) return;
  DB = { settings: { ...DEFAULT_SETTINGS, ...d.settings }, expenses: d.expenses || {}, drafts: d.drafts || {}, cash: d.cash || {} };
  persist(); S.settingsDirty = false; render();
  toast("Backup restored");
}
async function wipeAll() {
  const ex = E(), ds = D(), cs = C();
  if (!(await confirmIn("Delete all entries?", `${ex.length} expenses, ${ds.length} drafts and ${cs.length} cash rows will be deleted, with every receipt photo. Settings stay. This can't be undone.`, "Delete all"))) return;
  DB.expenses = {}; DB.drafts = {}; DB.cash = {};
  persist();
  try { await tx("readwrite", s => s.clear()); } catch {}
  urlCache.forEach(u => URL.revokeObjectURL(u)); urlCache.clear();
  render();
  toast("All entries deleted");
}

/* ---------- modal, toast ---------- */
function confirmIn(title, body, ok) {
  return new Promise(res => {
    const r = $("#modal-root");
    r.innerHTML = `<div class="modal-wrap"><div class="scrim" data-m="no"></div><div class="modal" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(body)}</p><div class="modal-actions"><button class="btn" data-m="no">Cancel</button><button class="btn danger" data-m="yes">${esc(ok)}</button></div></div></div>`;
    r.onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; r.innerHTML = ""; r.onclick = null; res(b.dataset.m === "yes"); };
  });
}
let toastTimer;
function toast(msg, { action, onAction, ms = 3500 } = {}) {
  const r = $("#toast-root");
  clearTimeout(toastTimer);
  r.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button class="toast-act">${esc(action)}</button>` : ""}</div>`;
  if (action) r.querySelector(".toast-act").onclick = () => { r.innerHTML = ""; clearTimeout(toastTimer); onAction(); };
  toastTimer = setTimeout(() => { r.innerHTML = ""; }, ms);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const chip = e.target.closest(".seg .chip");
  if (chip) {
    const g = chip.closest(".seg");
    g.dataset.value = chip.dataset.v;
    g.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === chip));
    g.dispatchEvent(new CustomEvent("segchange", { bubbles: true, detail: { group: g.dataset.group, value: chip.dataset.v } }));
    return;
  }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case "tab": S.view = el.dataset.view; S.settingsDirty = false; render(); window.scrollTo(0, 0); break;
    case "scan": startScan(); break;
    case "quick": openQuick(); break;
    case "review": openReview(); break;
    case "cash": openCash(el.dataset.tab); break;
    case "filter": S.filter = el.dataset.v; render(); break;
    case "edit": openEdit(id); break;
    case "cashrow": openCashRow(id); break;
    case "close": closeSheet(); render(); break;
    case "go-settings": closeSheet(); S.view = "settings"; S.settingsDirty = false; render(); window.scrollTo(0, 0); break;
    case "qa-minus": S.qa.qty = Math.max(1, S.qa.qty - 1); S.qa.upd(); break;
    case "qa-plus": S.qa.qty = Math.min(99, S.qa.qty + 1); S.qa.upd(); break;
    case "qa-save": saveQuick(); break;
    case "rv-save": reviewSave(); break;
    case "rv-skip": reviewSkip(); break;
    case "rv-discard": reviewDiscard(); break;
    case "ed-save": editSave(id); break;
    case "ed-delete": editDelete(id); break;
    case "item-add": $("#ef-items").insertAdjacentHTML("beforeend", itemRow()); break;
    case "item-del": el.closest(".item-row").remove(); break;
    case "cash-in-save": cashInSave(); break;
    case "cash-count-save": cashCountSave(); break;
    case "gap-log": gapLog(+el.dataset.gap); break;
    case "lightbox": {
      const src = el.querySelector("img")?.src; if (!src) break;
      const r = $("#modal-root");
      r.innerHTML = `<button class="lightbox" aria-label="Close photo"><img src="${esc(src)}" alt="Receipt photo"></button>`;
      r.onclick = () => { r.innerHTML = ""; r.onclick = null; };
      break;
    }
    case "test-key": testKey(); break;
    case "export": exportCSV(); break;
    case "backup": backup(); break;
    case "restore": $("#restore-input").click(); break;
    case "wipe": wipeAll(); break;
    case "cat-add": $("#cat-list").insertAdjacentHTML("beforeend", catRow({ label: "", line: null, sub: null })); S.settingsDirty = true; break;
    case "cat-del": el.closest(".cat-row").remove(); S.settingsDirty = true; break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "scan-input") { const files = [...e.target.files]; e.target.value = ""; scanFiles(files); return; }
  if (e.target.id === "restore-input") { const f = e.target.files[0]; e.target.value = ""; if (f) restore(f); return; }
  if (e.target.dataset.check) {
    let done = {}; try { done = JSON.parse(localStorage.getItem(CHECK_KEY) || "{}"); } catch {}
    done[e.target.dataset.check] = e.target.checked;
    try { localStorage.setItem(CHECK_KEY, JSON.stringify(done)); } catch {}
  }
  if (e.target.classList.contains("cat-line")) e.target.closest(".cat-row").querySelector(".cat-sub").hidden = e.target.value !== "food_transport";
  if (e.target.closest("#settings-form")) S.settingsDirty = true;
});
document.addEventListener("input", e => { if (e.target.closest("#settings-form")) S.settingsDirty = true; });
document.addEventListener("submit", e => { if (e.target.id === "settings-form") { e.preventDefault(); saveSettings(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.view === "home" && !S.sheet) render(); });

/* ---------- boot ---------- */
render();
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
